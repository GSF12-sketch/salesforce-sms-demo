<!DOCTYPE html>
<html>

<head>
    <title>SMS Portal</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <h1>SMS Portal</h1>

    <p>Search for a Salesforce Contact and send an SMS.</p>

    <hr>

    <h3>Search Contact</h3>

    <input
        type="text"
        id="searchBox"
        placeholder="Enter Contact Name">

    <button id="searchButton">
        Search
    </button>

    <div id="results">
    </div>

    <!-- SMS Section -->
    <div id="smsSection" style="display: none;">

        <hr>

        <h3>Send SMS</h3>

        <p>
            <strong>Mobile:</strong>
            <span id="selectedMobile"></span>
        </p>

        <textarea
            id="messageBox"
            rows="5"
            placeholder="Type your message here..."></textarea>

        <br><br>

        <button id="sendSmsButton">
            Send SMS
        </button>

        <p id="smsStatus"></p>

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
